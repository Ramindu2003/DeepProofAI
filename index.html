<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepProof AI Scanner</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        input[type="file"] { margin: 15px 0; border: 1px solid #ddd; padding: 10px; border-radius: 6px; width: 90%; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        #result { margin-top: 25px; font-weight: bold; padding: 15px; border-radius: 6px; display: none; }
        .fake { background: #ffeded; color: #e74c3c; border: 1px solid #ffbaba; }
        .real { background: #eafaf1; color: #27ae60; border: 1px solid #a3e4d7; }
        .loader { display: none; margin-top: 20px; color: #34495e; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>DeepProof AI 🔍</h2>
        <p>Upload any image to check if it's Real or AI-Generated.</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="scanImage()">Scan Image</button>
        
        <div class="loader" id="loader">Scanning image... Please wait ⏳</div>
        <div id="result"></div>
    </div>

    <script>
        async function scanImage() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');

            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            resultDiv.style.display = "none";
            loader.style.display = "block";

            try {
                // මෙතන තියෙන ලින්ක් එක ඔයාගේ අලුත් Vercel ලින්ක් එකට මාරු කරන්න!
                const response = await fetch("https://deep-proof-ai-eight.vercel.app/scan", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                loader.style.display = "none";
                resultDiv.style.display = "block";

                if (data.status === "success") {
                    resultDiv.innerHTML = `${data.message}<br><br>AI Confidence: <b>${data.ai_confidence}</b>`;
                    resultDiv.className = data.is_deepfake ? "fake" : "real";
                } else {
                    resultDiv.innerHTML = "Error: " + data.message;
                    resultDiv.className = "fake";
                }
            } catch (error) {
                loader.style.display = "none";
                resultDiv.style.display = "block";
                resultDiv.innerHTML = "Network Error! Could not connect to API.";
                resultDiv.className = "fake";
            }
        }
    </script>
</body>
</html>
